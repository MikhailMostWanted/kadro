name: Desktop builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kadro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qtarch: linux_gcc_64
            label: linux-test
          - os: windows-2022
            qtarch: win64_msvc2022_64
            label: windows-x64
          - os: macos-15
            qtarch: clang_64
            label: macos-universal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      QT_MEDIA_BACKEND: ffmpeg
      QT_FFMPEG_DECODING_HW_DEVICE_TYPES: ','
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Select macOS 15 SDK for Qt 6.8
        if: runner.os == 'macOS'
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.qtarch }}
          modules: 'qtmultimedia qtimageformats'
          cache: true
      - name: Configure
        run: |
          extra=()
          if [[ "$RUNNER_OS" == 'macOS' ]]; then
            extra+=('-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' '-DCMAKE_OSX_DEPLOYMENT_TARGET=12.0')
            extra+=("-DCMAKE_OSX_SYSROOT=$(xcrun --sdk macosx --show-sdk-path)")
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON "${extra[@]}"
      - name: Build
        run: cmake --build build --parallel 3
      - name: Test
        run: ctest --test-dir build --output-on-failure --output-junit results.xml
      - name: Package runtime
        if: runner.os != 'Linux'
        run: |
          cmake --install build --prefix "$GITHUB_WORKSPACE/dist" --config Release
          python tools/runtime_inventory.py dist
          cp dist/licenses/runtime.json build/test-artifacts/runtime.json
          cp tests/fixtures/synthetic.heic build/test-artifacts/synthetic.heic
      - name: Create and check macOS disk image
        if: runner.os == 'macOS'
        run: |
          tools/package_macos.sh dist WantedView-macOS-universal-RC.dmg
          hdiutil verify WantedView-macOS-universal-RC.dmg
          work="$(mktemp -d)"
          mkdir "$work/mount" "$work/installed"
          hdiutil attach WantedView-macOS-universal-RC.dmg -readonly -nobrowse -mountpoint "$work/mount"
          trap 'hdiutil detach "$work/mount"' EXIT
          ditto "$work/mount/Kadro.app" "$work/installed/Kadro.app"
          test -s "$work/mount/licenses/runtime.json"
          arches=" $(lipo -archs "$work/installed/Kadro.app/Contents/MacOS/Kadro") "
          [[ "$arches" == *" arm64 "* && "$arches" == *" x86_64 "* ]]
          codesign --verify --deep --strict "$work/installed/Kadro.app"
          python tools/check_package.py "$work/installed" build/test-artifacts
      - name: Create and check per-user Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $iscc)) { throw 'Inno Setup 6 compiler is missing' }
          $version = (Select-String -LiteralPath CMakeLists.txt -Pattern '^project\(Kadro VERSION ([0-9.]+) ').Matches[0].Groups[1].Value
          & $iscc "/DStageDir=$PWD\dist" "/DProductVersion=$version" "/O$PWD" packaging/wanted-view.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC returned $LASTEXITCODE" }
          Get-AuthenticodeSignature -LiteralPath WantedView-Windows-x64-RC.exe | Select-Object Status
          ./tools/check_windows_installer.ps1 -Setup WantedView-Windows-x64-RC.exe -FixtureDir build/test-artifacts -AssociationProbe build/kadro_ui_tests.exe
      - name: Upload macOS disk image
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: WantedView-macOS-universal-RC
          path: WantedView-macOS-universal-RC.dmg
          if-no-files-found: error
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: WantedView-Windows-x64-RC
          path: WantedView-Windows-x64-RC.exe
          if-no-files-found: error
      - name: Upload Windows portable package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Kadro-windows-x64
          path: dist/
          if-no-files-found: error
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.label }}
          path: |
            build/results.xml
            build/Testing/Temporary/LastTest.log
            build/test-artifacts/
          if-no-files-found: warn
